<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعرف برجك وحكمة إسلامية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            text-align: center;
            direction: rtl;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #fff;
            padding: 50px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            display: inline-block;
            width: 80%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #ffdd99;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            width: 80%;
            max-width: 250px;
        }
        input {
            background: #fff;
            color: #333;
            text-align: center;
        }
        button {
            background: #ffdd99;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ffbb33;
        }
        #result {
            font-size: 1.2em;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .footer {
            margin-top: 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffdd99;
        }
        .footer a {
            text-decoration: none;
            color: #ffbb33;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>اعرف برجك وحكمة إسلامية</h2>
        <label>أدخل يوم وشهر ميلادك:</label>
        <br>
        <input type="number" id="day" placeholder="اليوم" min="1" max="31">
        <input type="number" id="month" placeholder="الشهر" min="1" max="12">
        <br>
        <button onclick="getHoroscope()">اعرف برجك</button>

        <div id="result"></div>
    </div>

    <div class="footer">
        Developed by <span style="color: #ffbb33;">Ahmed</span> - 
        <a href="https://t.me/A4A_MOD" target="_blank">@A4A_MOD</a>
    </div>

    <script>
        function getHoroscope() {
            let day = document.getElementById("day").value;
            let month = document.getElementById("month").value;
            let horoscope = "";
            let wisdoms = [
                "اتقوا الله ويعلمكم الله.",
                "الصبر مفتاح الفرج.",
                "من توكل على الله فهو حسبه.",
                "إن الله مع الصابرين.",
                "الدعاء سلاح المؤمن.",
                "من حسن إسلام المرء تركه ما لا يعنيه."
            ];

            if (month == 1 && day >= 20 || month == 2 && day <= 18) horoscope = "برج الدلو ♒";
            else if (month == 2 && day >= 19 || month == 3 && day <= 20) horoscope = "برج الحوت ♓";
            else if (month == 3 && day >= 21 || month == 4 && day <= 19) horoscope = "برج الحمل ♈";
            else if (month == 4 && day >= 20 || month == 5 && day <= 20) horoscope = "برج الثور ♉";
            else if (month == 5 && day >= 21 || month == 6 && day <= 20) horoscope = "برج الجوزاء ♊";
            else if (month == 6 && day >= 21 || month == 7 && day <= 22) horoscope = "برج السرطان ♋";
            else if (month == 7 && day >= 23 || month == 8 && day <= 22) horoscope = "برج الأسد ♌";
            else if (month == 8 && day >= 23 || month == 9 && day <= 22) horoscope = "برج العذراء ♍";
            else if (month == 9 && day >= 23 || month == 10 && day <= 22) horoscope = "برج الميزان ♎";
            else if (month == 10 && day >= 23 || month == 11 && day <= 21) horoscope = "برج العقرب ♏";
            else if (month == 11 && day >= 22 || month == 12 && day <= 21) horoscope = "برج القوس ♐";
            else if (month == 12 && day >= 22 || month == 1 && day <= 19) horoscope = "برج الجدي ♑";
            else horoscope = "تأكد من إدخال البيانات بشكل صحيح.";

            let wisdom = wisdoms[Math.floor(Math.random() * wisdoms.length)];

            document.getElementById("result").innerHTML = `<p><strong>برجك:</strong> ${horoscope}</p><p><strong>حكمة اليوم:</strong> ${wisdom}</p>`;
        }
    </script>

</body>
</html>

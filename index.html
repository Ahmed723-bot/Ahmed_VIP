  <style>
    :root {
      --bg-color: #f3f3f3;
      --text-color: #333;
      --card-bg: #fff;
      --btn-bg: #007bff;
      --btn-hover: #0056b3;
    }
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #fff;
      --card-bg: #1e1e1e;
      --btn-bg: #3498db;
      --btn-hover: #2980b9;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg-color);
      text-align: center;
      margin: 0;
      padding: 0;
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    h1 {
      padding: 20px 0;
      font-size: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #title img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .app {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      width: 220px;
      text-align: center;
      transition: transform 0.3s, background 0.3s;
    }
    .app:hover {
      transform: translateY(-5px);
    }
    .app img {
      width: 110px;
      height: 110px;
      border-radius: 15px;
    }
    .app h3 {
      margin: 10px 0;
      color: var(--text-color);
    }
    .app a {
      display: inline-block;
      background: var(--btn-bg);
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .app a:hover {
      background: var(--btn-hover);
    }
    .footer {
      margin-top: 30px;
      padding: 15px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: inline-block;
    }
    .footer img {
      width: 24px;
      vertical-align: middle;
      margin-left: 5px;
    }
    .footer a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    #dark-mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: transparent;
      border: none;
      color: var(--text-color);
      font-size: 24px;
      cursor: pointer;
    }
    #dark-mode-toggle:hover {
      color: var(--btn-hover);
    }
  </style>
